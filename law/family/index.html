<body>

<!-- Chat Widget -->
<script>
(function(){
  var x=new XMLHttpRequest();
  x.open("GET","../../../chat-widget.html",true);
  x.onload=function(){
    if(x.status!==200)return;
    var t=x.responseText;
    var p=new DOMParser().parseFromString(t,"text/html");
    var st=p.querySelector("style");
    if(st){var ns=document.createElement("style");ns.textContent=st.textContent;document.head.appendChild(ns)}
    var w=p.getElementById("chat-widget");
    if(w){document.body.appendChild(document.adoptNode(w))}
    var parts=t.split("<"+"script>");
    if(parts.length>1){var sc=parts[1].split("<"+"/scr"+"ipt>")[0];var js=document.createElement("script");js.textContent=sc;document.body.appendChild(js)}
  };
  x.send();
})();
</script>
</body>
</html>
