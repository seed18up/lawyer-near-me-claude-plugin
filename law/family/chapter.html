<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <title>กำลังโอนหน้า...</title>
</head>
<body>
<script>window.location.replace('../ppc/family/chapter.html' + window.location.search);</script>

<!-- Chat Widget -->
<script>
(function(){
  var x=new XMLHttpRequest();
  x.open("GET","../../../chat-widget.html",true);
  x.onload=function(){
    if(x.status!==200)return;
    var t=x.responseText;
    var p=new DOMParser().parseFromString(t,"text/html");
    var st=p.querySelector("style");
    if(st){var ns=document.createElement("style");ns.textContent=st.textContent;document.head.appendChild(ns)}
    var w=p.getElementById("chat-widget");
    if(w){document.body.appendChild(document.adoptNode(w))}
    var sc=p.querySelector("script");
    if(sc){var js=document.createElement("script");js.textContent=sc.textContent;document.body.appendChild(js)}
  };
  x.send();
})();
</script>
</body>
</html>
