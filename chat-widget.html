
  <!-- ╔══════════════════════════════════════╗
       ║  LEGAL CHAT WIDGET — CSS             ║
       ╚══════════════════════════════════════╝ -->
  <style>
    /* ─────────────────────────────────────────
       CHAT WIDGET — TOGGLE BUTTON
    ───────────────────────────────────────── */
    #cw-toggle {
      position: fixed;
      bottom: 28px;
      right: 28px;
      z-index: 9000;
      display: flex;
      align-items: center;
      gap: 0;
      cursor: pointer;
      border: none;
      background: none;
      padding: 0;
      font-family: var(--font);
    }

    #cw-toggle-label {
      background: linear-gradient(135deg, var(--navy) 0%, var(--navy-dark) 100%);
      color: var(--white);
      font-size: 13px;
      font-weight: 700;
      padding: 10px 16px 10px 18px;
      border-radius: 28px 0 0 28px;
      white-space: nowrap;
      box-shadow: -4px 0 20px rgba(27,58,139,.25);
      transition: opacity .2s;
      letter-spacing: .2px;
    }

    #cw-toggle-btn {
      position: relative;
      width: 56px;
      height: 56px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--navy) 0%, var(--navy-dark) 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 26px;
      box-shadow: 0 6px 24px rgba(27,58,139,.38), 0 2px 8px rgba(0,0,0,.18);
      transition: transform .2s cubic-bezier(.34,1.56,.64,1);
      flex-shrink: 0;
      line-height: 1;
    }

    #cw-toggle:hover #cw-toggle-btn { transform: scale(1.07); }

    #cw-badge {
      position: absolute;
      top: -4px;
      right: -4px;
      width: 20px;
      height: 20px;
      background: var(--red);
      color: var(--white);
      font-size: 11px;
      font-weight: 800;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 2px solid var(--white);
      animation: cw-pulse-badge 2s ease-in-out infinite;
    }

    @keyframes cw-pulse-badge {
      0%, 100% { box-shadow: 0 0 0 0 rgba(183,28,28,.55); }
      50%       { box-shadow: 0 0 0 6px rgba(183,28,28,.0); }
    }

    /* When panel is open: hide label, show ✕ */
    #cw-toggle.cw-open #cw-toggle-label { display: none; }
    #cw-toggle.cw-open #cw-toggle-btn   { border-radius: 50%; }
    #cw-toggle.cw-open #cw-badge        { display: none; }

    /* ─────────────────────────────────────────
       CHAT PANEL
    ───────────────────────────────────────── */
    #cw-panel {
      position: fixed;
      bottom: 100px;
      right: 28px;
      width: 380px;
      height: 560px;
      background: var(--white);
      border-radius: var(--radius-lg);
      box-shadow: 0 20px 60px rgba(27,58,139,.20), 0 8px 24px rgba(0,0,0,.12);
      display: flex;
      flex-direction: column;
      z-index: 8999;
      overflow: hidden;
      transform: translateY(24px) scale(.97);
      opacity: 0;
      pointer-events: none;
      transition: transform .28s cubic-bezier(.34,1.56,.64,1), opacity .22s ease;
    }

    #cw-panel.cw-visible {
      transform: translateY(0) scale(1);
      opacity: 1;
      pointer-events: auto;
    }

    /* ─────────────────────────────────────────
       CHAT HEADER
    ───────────────────────────────────────── */
    #cw-header {
      background: linear-gradient(135deg, var(--navy-deeper) 0%, var(--navy) 100%);
      padding: 14px 16px 0;
      flex-shrink: 0;
    }

    #cw-header-top {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 12px;
    }

    #cw-agent-avatar {
      width: 40px;
      height: 40px;
      background: rgba(255,255,255,.15);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
      flex-shrink: 0;
      border: 2px solid rgba(255,255,255,.25);
    }

    #cw-agent-info { flex: 1; min-width: 0; }

    #cw-agent-name {
      font-size: 14px;
      font-weight: 800;
      color: var(--white);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    #cw-agent-title {
      font-size: 11px;
      color: rgba(255,255,255,.65);
      margin-top: 1px;
    }

    #cw-agent-status {
      font-size: 11px;
      color: rgba(255,255,255,.75);
      display: flex;
      align-items: center;
      gap: 4px;
      margin-top: 2px;
    }

    #cw-close-btn {
      background: rgba(255,255,255,.12);
      border: none;
      color: rgba(255,255,255,.85);
      width: 32px;
      height: 32px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      cursor: pointer;
      flex-shrink: 0;
      transition: background .15s;
      font-family: var(--font);
      line-height: 1;
    }

    #cw-close-btn:hover { background: rgba(255,255,255,.22); }

    /* Agent selector tabs */
    #cw-tabs {
      display: flex;
      gap: 4px;
      padding-bottom: 0;
    }

    .cw-tab {
      flex: 1;
      font-family: var(--font);
      font-size: 11px;
      font-weight: 700;
      color: rgba(255,255,255,.60);
      background: transparent;
      border: none;
      border-bottom: 3px solid transparent;
      padding: 7px 4px;
      cursor: pointer;
      text-align: center;
      transition: color .15s, border-color .15s;
      white-space: nowrap;
      letter-spacing: .3px;
    }

    .cw-tab:hover  { color: rgba(255,255,255,.90); }
    .cw-tab.cw-tab-active {
      color: var(--gold);
      border-bottom-color: var(--gold);
    }

    /* ─────────────────────────────────────────
       MESSAGES AREA
    ───────────────────────────────────────── */
    #cw-messages {
      flex: 1;
      overflow-y: auto;
      padding: 16px 14px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      scroll-behavior: smooth;
    }

    #cw-messages::-webkit-scrollbar { width: 4px; }
    #cw-messages::-webkit-scrollbar-track { background: transparent; }
    #cw-messages::-webkit-scrollbar-thumb { background: var(--gray-200); border-radius: 4px; }

    /* User bubble */
    .cw-msg-user {
      display: flex;
      justify-content: flex-end;
    }

    .cw-msg-user .cw-bubble {
      background: linear-gradient(135deg, var(--navy) 0%, var(--navy-mid) 100%);
      color: var(--white);
      padding: 10px 14px;
      border-radius: 18px 18px 4px 18px;
      max-width: 78%;
      font-size: 14px;
      line-height: 1.6;
      word-break: break-word;
    }

    /* Agent bubble */
    .cw-msg-agent {
      display: flex;
      align-items: flex-end;
      gap: 8px;
    }

    .cw-msg-agent-avatar {
      width: 28px;
      height: 28px;
      background: var(--navy-light);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      flex-shrink: 0;
      margin-bottom: 2px;
    }

    .cw-msg-agent-wrap {
      max-width: 80%;
      display: flex;
      flex-direction: column;
      gap: 3px;
    }

    .cw-msg-agent-name {
      font-size: 10px;
      font-weight: 700;
      color: var(--text-muted);
      padding-left: 2px;
    }

    .cw-msg-agent .cw-bubble {
      background: var(--white);
      color: var(--text-main);
      border: 1px solid var(--gray-200);
      box-shadow: 0 2px 8px rgba(0,0,0,.06);
      padding: 10px 14px;
      border-radius: 18px 18px 18px 4px;
      font-size: 14px;
      line-height: 1.65;
      word-break: break-word;
      white-space: pre-wrap;
    }

    /* Typing indicator */
    #cw-typing {
      display: none;
    }

    #cw-typing.cw-visible {
      display: flex;
    }

    #cw-typing .cw-bubble {
      display: flex;
      align-items: center;
      gap: 5px;
      padding: 12px 16px;
      min-width: 60px;
    }

    .cw-dot {
      width: 7px;
      height: 7px;
      background: var(--text-light);
      border-radius: 50%;
      animation: cw-bounce 1.3s ease-in-out infinite;
    }

    .cw-dot:nth-child(2) { animation-delay: .16s; }
    .cw-dot:nth-child(3) { animation-delay: .32s; }

    @keyframes cw-bounce {
      0%, 60%, 100% { transform: translateY(0); }
      30%           { transform: translateY(-6px); }
    }

    /* ─────────────────────────────────────────
       QUICK TOPIC CHIPS
    ───────────────────────────────────────── */
    #cw-chips-wrap {
      padding: 8px 14px;
      border-top: 1px solid var(--gray-100);
      overflow-x: auto;
      display: flex;
      gap: 6px;
      flex-shrink: 0;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
    }

    #cw-chips-wrap::-webkit-scrollbar { display: none; }

    .cw-chip {
      white-space: nowrap;
      font-family: var(--font);
      font-size: 12px;
      font-weight: 700;
      color: var(--navy);
      border: 1.5px solid var(--navy);
      background: transparent;
      border-radius: 20px;
      padding: 5px 13px;
      cursor: pointer;
      transition: background .15s, color .15s;
      flex-shrink: 0;
    }

    .cw-chip:hover {
      background: var(--navy);
      color: var(--white);
    }

    /* ─────────────────────────────────────────
       INPUT AREA
    ───────────────────────────────────────── */
    #cw-input-area {
      padding: 10px 12px 12px;
      border-top: 1px solid var(--gray-200);
      display: flex;
      align-items: flex-end;
      gap: 8px;
      flex-shrink: 0;
      background: var(--white);
    }

    #cw-textarea {
      flex: 1;
      font-family: var(--font);
      font-size: 14px;
      color: var(--text-main);
      background: var(--gray-bg);
      border: 1.5px solid var(--gray-200);
      border-radius: 10px;
      padding: 9px 12px;
      resize: none;
      outline: none;
      line-height: 1.5;
      min-height: 40px;
      max-height: 90px;
      transition: border-color .15s;
      overflow-y: auto;
    }

    #cw-textarea:focus { border-color: var(--navy); }
    #cw-textarea::placeholder { color: var(--text-light); }

    #cw-send-btn {
      width: 40px;
      height: 40px;
      background: linear-gradient(135deg, var(--navy) 0%, var(--navy-mid) 100%);
      color: var(--white);
      border: none;
      border-radius: 10px;
      font-size: 18px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: opacity .15s, transform .1s;
    }

    #cw-send-btn:hover  { opacity: .88; }
    #cw-send-btn:active { transform: scale(.93); }
    #cw-send-btn:disabled { opacity: .45; cursor: not-allowed; }

    /* ─────────────────────────────────────────
       FOOTER DISCLAIMER
    ───────────────────────────────────────── */
    #cw-footer {
      text-align: center;
      font-size: 10px;
      color: var(--text-light);
      padding: 4px 12px 8px;
      flex-shrink: 0;
      line-height: 1.5;
    }

    /* ─────────────────────────────────────────
       MOBILE RESPONSIVE
    ───────────────────────────────────────── */
    @media (max-width: 500px) {
      #cw-panel {
        width: 100vw;
        height: 85vh;
        bottom: 0;
        right: 0;
        border-radius: 20px 20px 0 0;
      }

      #cw-toggle {
        bottom: 16px;
        right: 16px;
      }
    }
  </style>

  <!-- ╔══════════════════════════════════════╗

  <!-- ╔══════════════════════════════════════╗
       ║  LEGAL CHAT WIDGET — JAVASCRIPT      ║
       ╚══════════════════════════════════════╝ -->
  <script>
  (function () {
    'use strict';

    /* ─────────────────────────────────────────
       CONSTANTS
    ───────────────────────────────────────── */
    const CHAT_API_URL = 'https://legal-chat.seed18up-net.workers.dev';

    const MAX_HISTORY = 10; // messages to send as context

    const AGENTS = {
      'legal-advisor': {
        id:     'legal-advisor',
        name:   'ดร.วรรณา สิทธิชัย',
        avatar: '👩‍⚖️',
        title:  'ที่ปรึกษากฎหมายหลัก',
      },
      'compliance': {
        id:     'compliance',
        name:   'คุณสิทธิศักดิ์ พงษ์ไพบูลย์',
        avatar: '🛡️',
        title:  'Compliance Officer',
      },
      'contract': {
        id:     'contract',
        name:   'คุณภัทรพงษ์ อารีย์วงศ์',
        avatar: '📋',
        title:  'Contract Specialist',
      },
    };

    /* ─────────────────────────────────────────
       STATE
    ───────────────────────────────────────── */
    let activeAgent    = AGENTS['legal-advisor'];
    let messageHistory = [];   // {role, content}[]
    let isPanelOpen    = false;
    let isStreaming    = false;
    let welcomeShown   = {}; // agentId → bool
    let userMessageCount = 0;
    let ctaShown         = false;

    /* ─────────────────────────────────────────
       DOM REFS
    ───────────────────────────────────────── */
    const toggle       = document.getElementById('cw-toggle');
    const toggleIcon   = document.getElementById('cw-toggle-icon');
    const badge        = document.getElementById('cw-badge');
    const panel        = document.getElementById('cw-panel');
    const messagesEl   = document.getElementById('cw-messages');
    const typingEl     = document.getElementById('cw-typing');
    const typingAvatar = document.getElementById('cw-typing-avatar');
    const textarea     = document.getElementById('cw-textarea');
    const sendBtn      = document.getElementById('cw-send-btn');
    const tabs         = document.querySelectorAll('.cw-tab');
    const chips        = document.querySelectorAll('.cw-chip');
    const agentAvatar  = document.getElementById('cw-agent-avatar');
    const agentName    = document.getElementById('cw-agent-name');
    const agentTitle   = document.getElementById('cw-agent-title');
    const closeBtn     = document.getElementById('cw-close-btn');

    /* ─────────────────────────────────────────
       HELPERS
    ───────────────────────────────────────── */
    function scrollBottom() {
      messagesEl.scrollTop = messagesEl.scrollHeight;
    }

    function showTyping() {
      typingAvatar.textContent = activeAgent.avatar;
      typingEl.classList.add('cw-visible');
      typingEl.setAttribute('aria-hidden', 'false');
      // Move typing indicator to end of messages list
      messagesEl.appendChild(typingEl);
      scrollBottom();
    }

    function hideTyping() {
      typingEl.classList.remove('cw-visible');
      typingEl.setAttribute('aria-hidden', 'true');
    }

    function setInputDisabled(disabled) {
      textarea.disabled = disabled;
      sendBtn.disabled  = disabled;
      isStreaming       = disabled;
    }

    /* ─────────────────────────────────────────
       RENDER MESSAGES
    ───────────────────────────────────────── */
    function appendUserBubble(text) {
      const row = document.createElement('div');
      row.className = 'cw-msg-user';
      const bubble = document.createElement('div');
      bubble.className = 'cw-bubble';
      bubble.textContent = text;
      row.appendChild(bubble);
      messagesEl.appendChild(row);
      scrollBottom();
      return bubble;
    }

    function appendAgentBubble(agentObj) {
      const row  = document.createElement('div');
      row.className = 'cw-msg-agent';

      const ava  = document.createElement('div');
      ava.className = 'cw-msg-agent-avatar';
      ava.textContent = agentObj.avatar;

      const wrap = document.createElement('div');
      wrap.className = 'cw-msg-agent-wrap';

      const nameEl = document.createElement('div');
      nameEl.className = 'cw-msg-agent-name';
      nameEl.textContent = agentObj.name;

      const bubble = document.createElement('div');
      bubble.className = 'cw-bubble';

      wrap.appendChild(nameEl);
      wrap.appendChild(bubble);
      row.appendChild(ava);
      row.appendChild(wrap);
      messagesEl.appendChild(row);
      scrollBottom();
      return bubble;
    }

    function appendErrorBubble() {
      const bubble = appendAgentBubble(activeAgent);
      bubble.textContent = 'ขออภัย เกิดข้อผิดพลาด กรุณาลองใหม่อีกครั้ง';
      bubble.style.color = 'var(--red)';
    }

    function showCallbackCTA() {
      if (ctaShown) return;
      ctaShown = true;
      const row = document.createElement('div');
      row.className = 'cw-msg-agent';
      row.innerHTML =
        '<div class="cw-msg-agent-avatar">' + activeAgent.avatar + '</div>' +
        '<div class="cw-msg-agent-wrap">' +
          '<div class="cw-msg-agent-name">' + activeAgent.name + '</div>' +
          '<div style="background:#f0f4ff;border:1.5px solid #c7d3f5;border-radius:12px;padding:14px 16px;margin-top:4px;">' +
            '<div style="font-size:14px;font-weight:700;color:#1B3A8B;margin-bottom:6px;">📞 ต้องการให้ทนายโทรกลับไหม?</div>' +
            '<div style="font-size:13px;color:#555;margin-bottom:12px;line-height:1.5;">ฟรี ไม่มีค่าใช้จ่าย · ทนายความโทรกลับภายใน 24 ชั่วโมง</div>' +
            '<a href="consult.html" style="display:block;text-align:center;background:#1B3A8B;color:#fff;padding:10px 16px;border-radius:8px;font-size:13px;font-weight:700;text-decoration:none;">จองนัดโทรกลับ →</a>' +
          '</div>' +
        '</div>';
      messagesEl.appendChild(row);
      scrollBottom();
    }

    /* ─────────────────────────────────────────
       WELCOME MESSAGE
    ───────────────────────────────────────── */
    function showWelcome(agent) {
      if (welcomeShown[agent.id]) return;
      welcomeShown[agent.id] = true;

      const suffix = agent.id === 'compliance' ? 'ครับ' : 'ค่ะ';
      const pronoun = agent.id === 'compliance' ? 'ผม' : 'ดิฉัน';
      const text = `สวัสดี${suffix} ${pronoun} ${agent.name} ยินดีให้คำปรึกษาเบื้องต้นด้านกฎหมาย มีเรื่องอะไรให้ช่วยไหม${suffix}?`;

      const bubble = appendAgentBubble(agent);
      bubble.textContent = text;
      scrollBottom();
    }

    /* ─────────────────────────────────────────
       TOGGLE PANEL
    ───────────────────────────────────────── */
    function openPanel() {
      isPanelOpen = true;
      panel.classList.add('cw-visible');
      panel.setAttribute('aria-hidden', 'false');
      toggle.classList.add('cw-open');
      toggle.setAttribute('aria-expanded', 'true');
      toggleIcon.textContent = '✕';
      badge.style.display = 'none';
      textarea.focus();
      showWelcome(activeAgent);
    }
    window.cwOpenPanel = openPanel;
    window.cwOpenWithTopic = function(label) {
      openPanel();
      setTimeout(function() {
        sendMessage('สอบถามเรื่อง' + label + ' ช่วยแนะนำสิทธิ์และขั้นตอนทางกฎหมายด้วยครับ');
      }, 350);
    };

    function closePanel() {
      isPanelOpen = false;
      panel.classList.remove('cw-visible');
      panel.setAttribute('aria-hidden', 'true');
      toggle.classList.remove('cw-open');
      toggle.setAttribute('aria-expanded', 'false');
      toggleIcon.textContent = '⚖️';
    }

    toggle.addEventListener('click', function () {
      if (isPanelOpen) { closePanel(); } else { openPanel(); }
    });

    closeBtn.addEventListener('click', function (e) {
      e.stopPropagation();
      closePanel();
    });

    /* ─────────────────────────────────────────
       AGENT SELECTOR TABS
    ───────────────────────────────────────── */
    function switchAgent(agentId) {
      activeAgent = AGENTS[agentId] || AGENTS['legal-advisor'];
      // Update header
      agentAvatar.textContent = activeAgent.avatar;
      agentName.textContent   = activeAgent.name;
      agentTitle.textContent  = activeAgent.title;
      typingAvatar.textContent = activeAgent.avatar;
      // Reset history when switching agent
      messageHistory = [];
      userMessageCount = 0;
      ctaShown = false;
      // Clear messages
      const rows = messagesEl.querySelectorAll('.cw-msg-user, .cw-msg-agent:not(#cw-typing)');
      rows.forEach(function (r) { r.remove(); });
      // Show welcome for new agent
      showWelcome(activeAgent);
    }

    tabs.forEach(function (tab) {
      tab.addEventListener('click', function () {
        tabs.forEach(function (t) {
          t.classList.remove('cw-tab-active');
          t.setAttribute('aria-selected', 'false');
        });
        tab.classList.add('cw-tab-active');
        tab.setAttribute('aria-selected', 'true');
        switchAgent(tab.dataset.agent);
      });
    });

    /* ─────────────────────────────────────────
       QUICK TOPIC CHIPS
    ───────────────────────────────────────── */
    chips.forEach(function (chip) {
      chip.addEventListener('click', function () {
        const topic = chip.dataset.topic;
        sendMessage(topic);
      });
    });

    /* ─────────────────────────────────────────
       AUTO-RESIZE TEXTAREA
    ───────────────────────────────────────── */
    textarea.addEventListener('input', function () {
      textarea.style.height = 'auto';
      textarea.style.height = Math.min(textarea.scrollHeight, 90) + 'px';
    });

    /* ─────────────────────────────────────────
       SEND ON ENTER (not Shift+Enter)
    ───────────────────────────────────────── */
    textarea.addEventListener('keydown', function (e) {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        if (!isStreaming) sendMessage();
      }
    });

    sendBtn.addEventListener('click', function () {
      if (!isStreaming) sendMessage();
    });

    /* ─────────────────────────────────────────
       SEND MESSAGE + STREAMING
    ───────────────────────────────────────── */
    function sendMessage(overrideText) {
      const text = (overrideText !== undefined ? overrideText : textarea.value).trim();
      if (!text) return;

      // Clear input
      if (overrideText === undefined) {
        textarea.value = '';
        textarea.style.height = 'auto';
      }

      // Add user bubble
      appendUserBubble(text);
      userMessageCount++;

      // Update history
      messageHistory.push({ role: 'user', content: text });
      if (messageHistory.length > MAX_HISTORY) {
        messageHistory = messageHistory.slice(-MAX_HISTORY);
      }

      setInputDisabled(true);
      showTyping();

      // Prepare agent bubble for streaming (created after typing hides)
      let agentBubble = null;
      let accumulated = '';

      fetch(CHAT_API_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          messages: messageHistory.slice(),
          agent:    activeAgent.id,
        }),
      })
      .then(function (res) {
        if (!res.ok) {
          return res.text().then(function (t) { throw new Error(t || res.status); });
        }

        hideTyping();
        agentBubble = appendAgentBubble(activeAgent);

        const reader  = res.body.getReader();
        const decoder = new TextDecoder();
        let   buffer  = '';

        function pump() {
          return reader.read().then(function (result) {
            if (result.done) {
              // Stream complete — store assistant turn in history
              if (accumulated) {
                messageHistory.push({ role: 'assistant', content: accumulated });
                if (messageHistory.length > MAX_HISTORY) {
                  messageHistory = messageHistory.slice(-MAX_HISTORY);
                }
              }
              setInputDisabled(false);
              textarea.focus();
              scrollBottom();
              if (userMessageCount >= 2 && !ctaShown) {
                setTimeout(showCallbackCTA, 800);
              }
              return;
            }

            buffer += decoder.decode(result.value, { stream: true });

            // Process SSE lines
            const lines = buffer.split('\n');
            buffer = lines.pop(); // keep incomplete line

            lines.forEach(function (line) {
              if (!line.startsWith('data: ')) return;
              const data = line.slice(6).trim();
              if (data === '[DONE]') return;

              let parsed;
              try { parsed = JSON.parse(data); } catch (e) { return; }

              // Anthropic SSE: content_block_delta with delta.text
              if (
                parsed.type === 'content_block_delta' &&
                parsed.delta &&
                parsed.delta.type === 'text_delta' &&
                typeof parsed.delta.text === 'string'
              ) {
                accumulated += parsed.delta.text;
                agentBubble.textContent = accumulated;
                scrollBottom();
              }
            });

            return pump();
          });
        }

        return pump();
      })
      .catch(function (err) {
        console.error('[ChatWidget] error:', err);
        hideTyping();
        appendErrorBubble();
        setInputDisabled(false);
        textarea.focus();
        scrollBottom();
      });
    }

  })();
  </script>
